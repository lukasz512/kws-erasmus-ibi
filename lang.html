<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaszëbi w Europie! – language</title>
<style>
  body { margin: 0; min-height: 100vh; background: #F5F3EC; color: #0B1F3A; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; }
  img { height: 64px; margin-bottom: 12px; }
  a { display: block; width: min(420px, 100%); padding: 22px; border-radius: 16px; background: #0B1F3A; color: #fff; text-decoration: none; font-size: 24px; font-weight: 700; text-align: center; box-sizing: border-box; }
  a.alt { background: #fff; color: #0B1F3A; border: 2px solid #D9D5C8; }
</style>
</head>
<body>
<img src="img/kaszebi-logo.png" alt="Kaszëbi we swiecë">
<a id="en" class="">🇬🇧 English</a>
<a id="es" class="">🇪🇸 Español</a>
<a id="pl" class="alt">🇵🇱 Polski</a>
<script>
  const p = new URLSearchParams(location.search);
  ['en', 'es', 'pl'].forEach((l) => {
    const q = new URLSearchParams({ d: p.get('d') || 'p1', s: p.get('s') || '0', lang: l, view: '1' });
    if (p.get('t')) q.set('t', p.get('t'));
    document.getElementById(l).href = 'index.html?' + q;
  });
</script>
</body>
</html>
