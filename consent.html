<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Zgody RODO – Kaszëbi w Europie!</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Public Sans', Arial, sans-serif; color: #0B1F3A; background: #F5F3EC; padding: 16px; }
  .page { max-width: 820px; margin: 0 auto; background: #fff; border-radius: 22px; padding: 28px; box-shadow: 0 6px 24px rgba(11,31,58,.08); }
  header { display: flex; align-items: center; gap: 14px; border-bottom: 3px solid #0B1F3A; padding-bottom: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  header img { height: 46px; } header .eu { margin-left: auto; }
  h1 { font: 600 26px 'Source Serif 4', Georgia, serif; margin-bottom: 10px; }
  .clause { font-size: 15px; line-height: 1.5; background: #F7F7F4; border-radius: 14px; padding: 14px 16px; max-height: 260px; overflow: auto; }
  .clause p { margin-bottom: 8px; }
  label.ck { display: flex; gap: 12px; align-items: flex-start; font-size: 18px; margin: 14px 0; line-height: 1.35; }
  label.ck input { width: 28px; height: 28px; flex: none; margin-top: 2px; }
  input.name { width: 100%; font: 700 24px 'Public Sans'; padding: 14px; border-radius: 14px; border: 3px solid #0B1F3A; margin: 8px 0 14px; }
  .padwrap { position: relative; border: 3px dashed #0B1F3A; border-radius: 16px; background: #fff; height: 220px; touch-action: none; }
  .padwrap canvas { width: 100%; height: 100%; display: block; border-radius: 14px; }
  .padwrap span { position: absolute; left: 16px; bottom: 10px; color: #9AA3B2; font-size: 15px; pointer-events: none; }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button { font: 700 18px 'Public Sans'; padding: 14px 18px; border-radius: 14px; border: 0; background: #E7E4DA; color: #0B1F3A; }
  button.main { background: #0B1F3A; color: #fff; flex: 1; font-size: 20px; }
  .ok { background: #DDF1E4; border-radius: 14px; padding: 14px; font-weight: 700; margin-top: 12px; display: none; }
  .admin { max-width: 820px; margin: 16px auto 0; font-size: 15px; color: #4A5568; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .admin button { font-size: 15px; padding: 10px 14px; }
  .admin.boss { background: #fff; border-radius: 16px; padding: 14px 16px; margin-top: 12px; }
  .admin.boss label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  .print { display: none; }
  @media print {
    body { background: #fff; padding: 0; } .page, .admin { display: none; } .print { display: block; }
    .sheet { page-break-after: always; padding: 10mm 6mm; font-size: 12px; line-height: 1.45; }
    .sheet img.sig { height: 70px; border-bottom: 1px solid #000; }
  }
</style>
</head>
<body>
<div class="page">
  <header><img src="img/kaszebi-logo.png" alt=""><img src="img/bluebeehive.jpg" alt="" style="height:36px"><img class="eu" src="img/eu-pl.jpg" alt=""></header>
  <h1>Zgoda na przetwarzanie danych osobowych i wizerunku</h1>
  <div class="clause" id="clause"></div>
  <label class="ck"><input type="checkbox" id="c1"> <span><b>Wyrażam zgodę</b> na przetwarzanie moich danych osobowych w celu realizacji, dokumentacji i rozliczenia projektu Erasmus+ (wymagane).</span></label>
  <label class="ck"><input type="checkbox" id="c2"> <span>Wyrażam zgodę na <b>publikację mojego wizerunku</b> (zdjęcia, nagrania) na stronie i w mediach społecznościowych fundacji w celu promocji projektu (dobrowolne).</span></label>
  <input class="name" id="name" placeholder="Imię i nazwisko" autocomplete="off">
  <div class="padwrap"><canvas id="pad"></canvas><span>✍️ Podpisz się palcem</span></div>
  <div class="row"><button id="clear">↺ Wyczyść podpis</button><button class="main" id="save">✓ Zapisz zgodę</button></div>
  <div class="ok" id="ok"></div>
</div>
<div class="admin"><span id="count"></span><button id="print">🖨 Drukuj wszystkie zgody (PDF)</button><button id="backup">⬇ Kopia zapasowa</button></div>
<div class="admin boss">
  <b>🎓 Certyfikaty z podpisem prezesa</b>
  <span id="bossInfo"></span>
  <a href="prezes.html" style="font-weight:700;color:#003399">✍️ Podpis prezesa i podgląd →</a>
  <button id="certs">🖨 Drukuj certyfikaty (PDF)</button>
</div>
<div class="print" id="printArea"></div>
<div class="certs" id="certArea"></div>

<script src="data.js?v=67"></script>
<script src="common.js?v=67"></script>
<script src="cert-print.js?v=67"></script>
<script>
  LANG = 'pl'; // organiser station: consents and certificates print in Polish
  // Consents stay on this tablet only (never sent over the internet); print them as PDF for the project files.
  const CLAUSE = [
    'Administratorem danych osobowych jest Fundacja Kaszëbi we swiecë z siedzibą w Nakli (gmina Parchowo, powiat bytowski) [adres i KRS do uzupełnienia].',
    'Dane (imię i nazwisko, podpis, a za zgodą także wizerunek) są przetwarzane w celu realizacji, dokumentacji, rozliczenia i promocji projektu Erasmus+ KA122-ADU „KASZËBI W EUROPIE! – zapewnienie dostępu do rzetelnej i nowoczesnej edukacji cyfrowej na terenach wiejskich”, na podstawie art. 6 ust. 1 lit. a i c RODO.',
    'Odbiorcami danych mogą być: Fundacja Rozwoju Systemu Edukacji (Narodowa Agencja Programu Erasmus+), Komisja Europejska, organizacja przyjmująca Associació Educativa i Cultural Blue Beehive (Hiszpania) oraz podmioty kontrolujące projekt.',
    'Dane będą przechowywane przez okres wymagany zasadami programu Erasmus+ dla dokumentacji projektu, a dane przetwarzane na podstawie zgody do czasu jej wycofania.',
    'Przysługuje Pani/Panu prawo dostępu do danych, ich sprostowania, usunięcia, ograniczenia przetwarzania, wycofania zgody w dowolnym momencie (bez wpływu na wcześniejsze przetwarzanie) oraz wniesienia skargi do Prezesa Urzędu Ochrony Danych Osobowych.',
    'Podanie danych jest dobrowolne, ale niezbędne do udziału w projekcie. Zgoda na publikację wizerunku jest całkowicie dobrowolna. Ankieta ewaluacyjna jest anonimowa.'
  ];
  document.getElementById('clause').innerHTML = CLAUSE.map((p) => `<p>${p}</p>`).join('');
  const KEY = 'kws-consents';
  const list = () => store(KEY) || [];

  // Finger signature pad
  const cv = document.getElementById('pad'), ctx = cv.getContext('2d');
  let drawing = false, dirty = false;
  function size() { const r = cv.getBoundingClientRect(), k = devicePixelRatio || 1; cv.width = r.width * k; cv.height = r.height * k; ctx.scale(k, k); ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B1F3A'; }
  size(); addEventListener('resize', () => { if (!dirty) size(); });
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', (e) => { drawing = true; dirty = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); });
  cv.addEventListener('pointermove', (e) => { if (!drawing) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); });
  addEventListener('pointerup', () => { drawing = false; });
  document.getElementById('clear').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; };

  function refresh() { document.getElementById('count').textContent = `Zapisanych zgód na tym urządzeniu: ${list().length}`; }
  document.getElementById('save').onclick = () => {
    const name = document.getElementById('name').value.trim();
    if (!document.getElementById('c1').checked) { alert('Zaznacz zgodę na przetwarzanie danych (wymagane).'); return; }
    if (!name) { document.getElementById('name').focus(); return; }
    if (!dirty) { alert('Podpisz się palcem w ramce.'); return; }
    const all = list();
    all.push({ name, image: document.getElementById('c2').checked, sig: cv.toDataURL('image/png'), at: new Date().toISOString() });
    store(KEY, all);
    const ok = document.getElementById('ok'); ok.style.display = 'block'; ok.textContent = `✓ Dziękujemy, ${name}! Zgoda zapisana. Następna osoba może się podpisać.`;
    document.getElementById('name').value = ''; document.getElementById('c1').checked = false; document.getElementById('c2').checked = false;
    ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; refresh(); scrollTo(0, 0);
  };
  document.getElementById('print').onclick = () => {
    const pa = document.getElementById('printArea');
    pa.innerHTML = list().map((c) => `<div class="sheet"><h2 style="font-family:Georgia">Zgoda na przetwarzanie danych osobowych i wizerunku</h2>
      ${CLAUSE.map((p) => `<p>${p}</p>`).join('')}
      <p>☑ Zgoda na przetwarzanie danych w celu realizacji projektu</p><p>${c.image ? '☑' : '☐'} Zgoda na publikację wizerunku</p>
      <p><b>${c.name}</b> · ${new Date(c.at).toLocaleString('pl-PL')}</p><img class="sig" src="${c.sig}" alt=""></div>`).join('');
    document.getElementById('certArea').innerHTML = '';
    setPage('A4 portrait', 12); print();
  };
  // President's signature and stamp are added on prezes.html; kept in this browser only, never uploaded.
  const BOSS = 'kws-boss';
  const boss = () => store(BOSS) || {};
  function bossInfo() { const b = boss(); document.getElementById('bossInfo').textContent = `Podpis: ${b.sig ? '✓' : '–'} · Pieczątka: ${b.stamp ? '✓' : '–'}`; }
  document.getElementById('certs').onclick = () => {
    const all = list(); if (!all.length) { alert('Brak zapisanych osób.'); return; }
    document.getElementById('printArea').innerHTML = '';
    document.getElementById('certArea').innerHTML = all.map((c) => certHtml(c.name, c.sig, boss())).join('');
    setPage('A4 portrait'); setTimeout(print, 400);
  };
  bossInfo();
  document.getElementById('backup').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(list(), null, 1)], { type: 'application/json' }));
    a.download = 'zgody-rodo-kaszebi-w-europie.json'; a.click();
  };
  refresh();
</script>
</body>
</html>
