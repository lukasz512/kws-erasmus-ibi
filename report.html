<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raport ankiety – Kaszëbi w Europie!</title>
<style>
  * { box-sizing: border-box; }
  body { font: 15px/1.45 Arial, sans-serif; color: #0B1F3A; margin: 0; padding: 24px 16px; background: #F5F3EC; }
  .page { max-width: 900px; margin: 0 auto; background: #fff; padding: 36px 40px; border-radius: 12px; }
  header { display: flex; align-items: center; gap: 16px; border-bottom: 3px solid #0B1F3A; padding-bottom: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  header img { height: 50px; } header .eu { margin-left: auto; height: 50px; }
  h1 { font: 600 26px Georgia, serif; margin: 0 0 4px; } h2 { font: 600 19px Georgia, serif; margin: 26px 0 8px; }
  .meta { color: #4A5568; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid #D9D5C8; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #0B1F3A; color: #fff; font-weight: 700; }
  .ok { color: #1E7B4A; font-weight: 700; } .no { color: #B3261E; font-weight: 700; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kpi { border: 1px solid #D9D5C8; border-radius: 10px; padding: 12px; } .kpi b { display: block; font: 600 30px Georgia, serif; }
  .bar { display: inline-block; height: 10px; background: #1E7B4A; border-radius: 3px; vertical-align: middle; }
  .bar.pre { background: #8A94A6; }
  .tools { max-width: 900px; margin: 0 auto 12px; display: flex; gap: 8px; }
  .tools button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: #0B1F3A; color: #fff; cursor: pointer; }
  .sign { display: flex; justify-content: space-between; margin-top: 48px; font-size: 13px; }
  .sign div { border-top: 1px solid #0B1F3A; width: 40%; padding-top: 6px; text-align: center; }
  @media print { body { background: #fff; padding: 0; } .tools { display: none; } .page { padding: 0; border-radius: 0; } @page { size: A4; margin: 14mm; } h2 { break-after: avoid; } tr { break-inside: avoid; } }
</style>
</head>
<body>
<div class="tools"><button onclick="print()">🖨 Drukuj / zapisz PDF</button></div>
<div class="page" id="page"></div>
<script src="data.js?v=77"></script>
<script src="common.js?v=77"></script>
<script src="survey.js?v=77"></script>
<script>
  LANG = 'pl';
  // Answers from phones arrive on the live channel; pull them here too, so the report works without the presentation open.
  const TOPIC = params.get('t') || store('kws-topic');
  async function pull() {
    await Survey.pull(TOPIC);
    return TOPIC ? `Dane z tego urządzenia + kanał sesji ${TOPIC} (kanał trzyma wiadomości ok. 12 h).` : 'Brak sesji na tym urządzeniu: otwórz raport na laptopie z prezentacją albo dodaj ?t=<kod sesji>.';
  }
  function draw(note) {
  const { TESTS } = Survey;
  const st = Survey.stats(), { pre, post, preAvg, postAvg, gain, people, reached, d1, d2 } = st;
  const yes = (v, t) => (v == null ? '–' : v >= t ? '<span class="ok">TAK</span>' : '<span class="no">NIE</span>');
  const dist = (list, it) => { const c = Survey.dist(list, it); const n = c.reduce((a, b) => a + b, 0) || 1; return it.a.map((o, i) => `${L(o)}: <b>${Math.round((100 * c[i]) / n)}%</b> (${c[i]})`).join('<br>'); };

  document.getElementById('page').innerHTML = `
    <header><img src="img/kaszebi-logo.png" alt=""><img src="img/bluebeehive.jpg" alt="" style="height:40px"><img class="eu" src="img/eu-pl.jpg" alt=""></header>
    <h1>Raport ankiety przed/po: dezinformacja</h1>
    <div class="meta">Projekt Erasmus+ KA122-ADU „KASZËBI W EUROPIE! – zapewnienie dostępu do rzetelnej i nowoczesnej edukacji cyfrowej na terenach wiejskich”${PROJECT_NO ? ' · nr ' + PROJECT_NO : ''} · Ibi i Alicante, 11–21.10.2026 · wygenerowano ${new Date().toLocaleString('pl-PL')}</div>
    <p class="note" style="background:#FFF6D6;border-radius:10px;padding:8px 12px;font-size:14px">${note}</p>
    <h2>Efekty uczenia się</h2>
    <div class="kpis">
      <div class="kpi">Test PRZED<b>${preAvg ?? '–'}%</b>n = ${pre.length}</div>
      <div class="kpi">Test PO<b>${postAvg ?? '–'}%</b>n = ${post.length}</div>
      <div class="kpi">Przyrost kompetencji<b>${gain == null ? '–' : (gain > 0 ? '+' : '') + gain + ' pp'}</b>cel: +40 pp</div>
    </div>
    <h2>Upowszechnianie</h2>
    <table><tr><th>Działanie</th><th>Liczba</th></tr>
      <tr><td>Uczestnicy, którzy udostępnili certyfikat na Facebooku (kliknięcie „Opublikuj”)</td><td>${Survey.fbCount()}</td></tr>
      <tr><td>Zgody RODO zapisane na tym urządzeniu</td><td>${(store('kws-consents') || []).length}</td></tr>
    </table>
    <h2>Wskaźniki z wniosku</h2>
    <table><tr><th>Wskaźnik</th><th>Wynik</th><th>Próg</th><th>Osiągnięty</th></tr>
      <tr><td>W1. Wynik testu PO</td><td>${postAvg ?? '–'}%</td><td>≥ 80%</td><td>${yes(postAvg, 80)}</td></tr>
      <tr><td>W2. Przyrost kompetencji grupy</td><td>${gain ?? '–'} pp</td><td>≥ +40 pp</td><td>${yes(gain, 40)}</td></tr>
      <tr><td>W3. Osoby z przyrostem ≥ 40 pp</td><td>${reached} z ${people.length}</td><td>≥ 80% osób</td><td>${people.length ? yes(Math.round((100 * reached) / people.length), 80) : '–'}</td></tr>
      <tr><td>W6. Zamiar sprawdzania źródła (D1 „tak, zawsze”)</td><td>${d1 ?? '–'}%</td><td>≥ 70%</td><td>${yes(d1, 70)}</td></tr>
      <tr><td>W6. Słowo-hasło w rodzinie (D2 „tak” lub „już mamy”)</td><td>${d2 ?? '–'}%</td><td>≥ 70%</td><td>${yes(d2, 70)}</td></tr>
    </table>
    <h2>Test wiedzy: odsetek poprawnych odpowiedzi</h2>
    <table><tr><th>Pytanie</th><th>PRZED</th><th>PO</th></tr>
      ${TESTS.map((q, i) => { const a = st.preQ[i], b = st.postQ[i];
        return `<tr><td>${q.id}. ${L(q.q)}</td><td><span class="bar pre" style="width:${a || 0}px"></span> ${a ?? '–'}%</td><td><span class="bar" style="width:${b || 0}px"></span> ${b ?? '–'}%</td></tr>`; }).join('')}
    </table>
    <h2>W4. Samoocena (skala 1–5)</h2>
    <table><tr><th>Twierdzenie</th><th>PRZED</th><th>PO</th><th>Zmiana</th></tr>
      ${st.B.map(({ item: x, pre: a, post: b }) => { return `<tr><td>${L(x.q)}</td><td>${a ?? '–'}</td><td>${b ?? '–'}</td><td>${a != null && b != null ? (b - a >= 0 ? '+' : '') + Math.round((b - a) * 10) / 10 : '–'}</td></tr>`; }).join('')}
    </table>
    <h2>W3. Wynik każdej osoby (anonimowy kod)</h2>
    <table><tr><th>Kod</th><th>PRZED</th><th>PO</th><th>Przyrost</th></tr>
      ${people.map((p) => `<tr><td>${p.code}</td><td>${p.pre}%</td><td>${p.post}%</td><td class="${p.post - p.pre >= 40 ? 'ok' : ''}">${p.post - p.pre > 0 ? '+' : ''}${p.post - p.pre} pp</td></tr>`).join('') || '<tr><td colspan="4">brak par przed/po</td></tr>'}
    </table>
    <h2>W5. Skala problemu przed wyjazdem</h2>
    <table><tr><th>Pytanie</th><th>Odpowiedzi (n = ${pre.length})</th></tr>
      ${SURVEY.filter((x) => x.part === 'A').map((x) => `<tr><td>${L(x.q)}</td><td>${dist(pre, x)}</td></tr>`).join('')}
    </table>
    <h2>Ocena wyjazdu</h2>
    <table><tr><th>Pytanie</th><th>Odpowiedzi (n = ${post.length})</th></tr>
      ${SURVEY.filter((x) => x.part === 'D').map((x) => `<tr><td>${L(x.q)}</td><td>${dist(post, x)}</td></tr>`).join('')}
    </table>
    <div class="sign"><div>Koordynator projektu</div><div>Data i podpis</div></div>`;
  }
  draw('⏳ Pobieram odpowiedzi…');
  // Every opening saves a dated CSV copy: the survey's only durable backup besides this browser.
  const backup = (note) => {
    const has = Survey.entries('pre').length + Survey.entries('post').length > 0;
    draw(note + (has ? ' Kopia CSV pobrana do Pobranych.' : ''));
    if (has) Survey.csv(`kws-ankieta-${new Date().toISOString().slice(0, 16).replace(/[T:]/g, '-')}.csv`);
  };
  pull().then(backup, () => backup('Nie udało się pobrać odpowiedzi z kanału.'));
</script>
</body>
</html>
