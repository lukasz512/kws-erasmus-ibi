<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certyfikat – Kaszëbi w Europie!</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #F5F3EC; color: #0B1F3A; font-family: 'Public Sans', Arial, sans-serif; padding: 16px; }
  .form { max-width: 560px; margin: 0 auto 20px; display: flex; flex-direction: column; gap: 12px; }
  .langs { display: flex; gap: 8px; }
  .langs button, .go, .chip { font: inherit; border-radius: 10px; border: 1px solid #D9D5C8; background: #fff; padding: 10px 14px; color: #0B1F3A; }
  input[type=text], textarea { font: inherit; font-size: 20px; padding: 14px; border-radius: 12px; border: 2px solid #0B1F3A; width: 100%; }
  textarea { font-size: 17px; min-height: 130px; }
  .go { background: #0B1F3A; color: #fff; font-size: 19px; font-weight: 700; padding: 16px; border: 0; }
  .go.fb { background: #1877F2; }
  .go:disabled { opacity: .5; }
  h2 { font: 600 24px Georgia, serif; margin-top: 18px; }
  .hint { font-size: 15px; color: #4A5568; line-height: 1.4; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-size: 15px; padding: 8px 12px; border-radius: 99px; background: #fff; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { aspect-ratio: 1; border-radius: 14px; border: 2px dashed #9AA3B2; background: #fff center/cover; display: grid; place-items: center; font-size: 30px; color: #9AA3B2; position: relative; overflow: hidden; }
  .slot input { position: absolute; inset: 0; opacity: 0; }
  .slot.has { border-style: solid; border-color: #0B1F3A; font-size: 0; }
  label.opt { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
  #preview { width: 100%; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.15); display: none; }
  .cert { max-width: 900px; margin: 0 auto; background: #fff; border: 10px solid #0B1F3A; outline: 3px solid #FFCC00; outline-offset: -22px; padding: 48px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; aspect-ratio: 1.414; }
  .cert img { height: 70px; }
  .cert h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(26px, 5vw, 46px); }
  .cert .name { font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(28px, 6vw, 54px); border-bottom: 2px solid #0B1F3A; padding: 0 24px 6px; min-width: 60%; min-height: 1.3em; }
  .cert p { font-size: clamp(13px, 2.2vw, 19px); line-height: 1.45; max-width: 680px; }
  .cert .eu { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: auto; }
  .cert .eu img { height: 54px; }
  .cert small { font-size: 11px; color: #4A5568; }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; padding: 0; }
    .form, .share { display: none !important; }
    .cert { max-width: none; width: 100%; height: 185mm; aspect-ratio: auto; }
  }
</style>
</head>
<body>
<div class="form">
  <div class="langs" id="langs"></div>
  <input type="text" id="name" autocomplete="name">
  <button class="go" id="save"></button>
</div>
<div class="cert" id="cert">
  <img src="img/kaszebi-logo.png" alt="Kaszëbi we swiecë">
  <h1 id="title"></h1>
  <div class="name" id="out"></div>
  <p id="body"></p>
  <div class="eu"><img src="img/eu-pl.jpg" alt=""><img src="img/bluebeehive.jpg" alt="" style="height:40px"></div>
  <small>Fundacja Kaszëbi we swiecë · Associació Educativa i Cultural Blue Beehive (Ibi) · KA122-ADU 2026</small>
</div>

<div class="form share">
  <h2 id="sTitle"></h2>
  <p class="hint" id="sHint"></p>
  <div class="photos" id="photos"></div>
  <textarea id="txt"></textarea>
  <div class="chips" id="chips"></div>
  <label class="opt"><input type="checkbox" id="tag" checked> <span id="tagL"></span></label>
  <button class="go fb" id="share"></button>
  <img id="preview" alt="">
  <p class="hint" id="after"></p>
</div>

<script src="data.js?v=50"></script>
<script src="common.js?v=50"></script>
<script>
  if (!params.get('lang') && store('kws-lang')) LANG = store('kws-lang');
  const FB_PAGE = 'https://www.facebook.com/371013242770908';
  const S = {
    title: T('Podziel się na Facebooku', 'Share on Facebook', 'Compártelo en Facebook'),
    hint: T('Dodaj do 3 zdjęć z wyjazdu i kilka słów od siebie. Powstanie jeden obrazek z Twoim certyfikatem i zdjęciami, gotowy do posta.', 'Add up to 3 photos from the trip and a few words of your own. You will get one picture with your certificate and photos, ready to post.', 'Añade hasta 3 fotos del viaje y unas palabras tuyas. Se creará una imagen con tu certificado y fotos, lista para publicar.'),
    placeholder: T('Co zapamiętasz z Hiszpanii? (możesz zostawić puste)', 'What will you remember from Spain? (you can leave it empty)', '¿Qué recordarás de España? (puedes dejarlo vacío)'),
    tag: T('Dodaj podpis projektu: Erasmus+, Unia Europejska i fundacja', 'Add the project credit: Erasmus+, the EU and the foundation', 'Añadir la mención del proyecto: Erasmus+, la UE y la fundación'),
    share: T('Udostępnij na Facebooku', 'Share on Facebook', 'Compartir en Facebook'),
    after: T('Tekst jest skopiowany: wklej go w poście. Oznacz stronę fundacji @Kaszëbi we swiecë, a my udostępnimy Twój wpis!', 'The text is copied: paste it into your post. Tag the foundation page @Kaszëbi we swiecë and we will share your post!', 'El texto está copiado: pégalo en tu publicación. ¡Etiqueta a la fundación @Kaszëbi we swiecë y lo compartiremos!'),
    starters: [
      T('Najbardziej zaskoczyło mnie… ', 'What surprised me most… ', 'Lo que más me sorprendió… '),
      T('Nauczyłam/em się, jak… ', 'I learned how to… ', 'Aprendí a… '),
      T('Z Hiszpanii przywożę… ', 'From Spain I bring home… ', 'De España me llevo… '),
      T('Polecam taki wyjazd, bo… ', 'I recommend a trip like this because… ', 'Recomiendo un viaje así porque… ')
    ],
    sign: T('Mobilność Erasmus+ „KASZËBI W EUROPIE!” · Ibi i Alicante 2026 · Fundacja Kaszëbi we swiecë · Współfinansowane przez Unię Europejską #ErasmusPlus #KaszëbiWEuropie', 'Erasmus+ mobility “KASZËBI IN EUROPE!” · Ibi and Alicante 2026 · Kaszëbi we swiecë Foundation · Co-funded by the European Union #ErasmusPlus #KaszëbiWEuropie', 'Movilidad Erasmus+ «KASZËBI EN EUROPA» · Ibi y Alicante 2026 · Fundación Kaszëbi we swiecë · Cofinanciado por la Unión Europea #ErasmusPlus #KaszëbiWEuropie')
  };
  const name = document.getElementById('name'), txt = document.getElementById('txt');
  const photos = [null, null, null];

  function draw() {
    const el = document.getElementById('langs'); el.innerHTML = '';
    ['pl', 'en', 'es'].forEach((l) => el.append(h('button', { onclick: () => { LANG = l; draw(); }, style: l === LANG ? 'background:#0B1F3A;color:#fff' : '' }, l.toUpperCase())));
    name.placeholder = L(UI.certName);
    document.getElementById('save').textContent = '⬇ ' + L(UI.certSave);
    document.getElementById('title').textContent = L(UI.certTitle);
    document.getElementById('body').textContent = L(UI.certBody);
    document.getElementById('sTitle').textContent = '📣 ' + L(S.title);
    document.getElementById('sHint').textContent = L(S.hint);
    txt.placeholder = L(S.placeholder);
    document.getElementById('tagL').textContent = L(S.tag);
    document.getElementById('share').textContent = 'f  ' + L(S.share);
    const ch = document.getElementById('chips'); ch.innerHTML = '';
    S.starters.forEach((st) => ch.append(h('button', { class: 'chip', onclick: () => { txt.value += (txt.value && !txt.value.endsWith('\n') ? '\n' : '') + L(st); txt.focus(); } }, '+ ' + L(st).trim())));
    const ph = document.getElementById('photos'); ph.innerHTML = '';
    photos.forEach((p, i) => {
      const inp = h('input', { type: 'file', accept: 'image/*' });
      const slot = h('label', { class: 'slot' + (p ? ' has' : ''), style: p ? `background-image:url('${p.src}')` : '' }, '📷', inp);
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; const img = new Image(); img.onload = () => { photos[i] = img; draw(); }; img.src = URL.createObjectURL(f); };
      ph.append(slot);
    });
  }
  name.addEventListener('input', () => { document.getElementById('out').textContent = name.value; });
  document.getElementById('save').onclick = () => { if (!name.value.trim()) { name.focus(); return; } print(); };

  const load = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  function cover(ctx, img, x, y, w, hgt, rad) {
    ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, hgt, rad); ctx.clip();
    const s = Math.max(w / img.width, hgt / img.height);
    ctx.drawImage(img, x + (w - img.width * s) / 2, y + (hgt - img.height * s) / 2, img.width * s, img.height * s);
    ctx.restore();
  }
  function wrap(ctx, text, x, y, maxW, lh) {
    const words = text.split(' '); let line = '';
    for (const w of words) { const t = line + w + ' '; if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line.trim(), x, y); line = w + ' '; y += lh; } else line = t; }
    ctx.fillText(line.trim(), x, y); return y;
  }
  // 1080×1350 portrait picture: certificate on top, up to 3 photos below.
  async function makeImage() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
    const x = c.getContext('2d');
    x.fillStyle = '#F5F3EC'; x.fillRect(0, 0, 1080, 1350);
    x.fillStyle = '#fff'; x.strokeStyle = '#0B1F3A'; x.lineWidth = 12; x.beginPath(); x.roundRect(40, 40, 1000, 700, 24); x.fill(); x.stroke();
    x.strokeStyle = '#FFCC00'; x.lineWidth = 4; x.beginPath(); x.roundRect(62, 62, 956, 656, 16); x.stroke();
    const [logo, eu, bb] = await Promise.all([load('img/kaszebi-logo.png'), load('img/eu-pl.jpg'), load('img/bluebeehive.jpg')]);
    if (logo) x.drawImage(logo, 540 - 120, 90, 240, 240 * logo.height / logo.width);
    x.textAlign = 'center'; x.fillStyle = '#0B1F3A';
    x.font = '600 52px "Source Serif 4", Georgia, serif'; x.fillText(L(UI.certTitle), 540, 270);
    x.font = '600 64px "Source Serif 4", Georgia, serif'; x.fillText(name.value.trim() || '…', 540, 370);
    x.fillRect(240, 392, 600, 3);
    x.font = '400 24px "Public Sans", Arial'; x.fillStyle = '#26334A';
    wrap(x, L(UI.certBody), 540, 440, 860, 34);
    if (eu) x.drawImage(eu, 300, 610, 240, 240 * eu.height / eu.width);
    if (bb) x.drawImage(bb, 590, 620, 190, 190 * bb.height / bb.width);
    const list = photos.filter(Boolean);
    if (list.length) {
      const gap = 20, w = (1000 - gap * (list.length - 1)) / list.length;
      list.forEach((p, i) => cover(x, p, 40 + i * (w + gap), 770, w, 540, 22));
    } else {
      x.fillStyle = '#003399'; x.beginPath(); x.roundRect(40, 770, 1000, 540, 22); x.fill();
      x.fillStyle = '#FFCC00'; x.font = '900 70px "Public Sans", Arial'; x.fillText('Ibi · Alicante 2026', 540, 1060);
    }
    return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
  }

  document.getElementById('share').onclick = async (e) => {
    if (!name.value.trim()) { name.focus(); scrollTo(0, 0); return; }
    const btn = e.currentTarget; btn.disabled = true;
    const blob = await makeImage();
    const prev = document.getElementById('preview'); prev.src = URL.createObjectURL(blob); prev.style.display = 'block';
    const text = [txt.value.trim(), document.getElementById('tag').checked ? L(S.sign) : ''].filter(Boolean).join('\n\n');
    try { await navigator.clipboard.writeText(text); } catch (err) { /* clipboard may be blocked */ }
    const file = new File([blob], 'kaszebi-w-europie.jpg', { type: 'image/jpeg' });
    document.getElementById('after').textContent = L(S.after);
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text, title: 'KASZËBI W EUROPIE!' });
      else {
        const a = h('a', { href: prev.src, download: 'kaszebi-w-europie.jpg' }); document.body.append(a); a.click(); a.remove();
        window.open(FB_PAGE, '_blank');
      }
    } catch (err) { /* user closed the share sheet */ }
    btn.disabled = false;
  };
  draw();
</script>
</body>
</html>
