<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certyfikat – Kaszëbi w Europie!</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #F5F3EC; color: #0B1F3A; font-family: 'Public Sans', Arial, sans-serif; padding: 16px; }
  .form { max-width: 560px; margin: 0 auto 20px; display: flex; flex-direction: column; gap: 12px; }
  .langs { display: flex; gap: 8px; }
  .langs button, .go { font: inherit; border-radius: 10px; border: 1px solid #D9D5C8; background: #fff; padding: 10px 14px; }
  input { font: inherit; font-size: 22px; padding: 14px; border-radius: 12px; border: 2px solid #0B1F3A; }
  .go { background: #0B1F3A; color: #fff; font-size: 20px; font-weight: 700; padding: 16px; border: 0; }
  .cert { max-width: 900px; margin: 0 auto; background: #fff; border: 10px solid #0B1F3A; outline: 3px solid #FFCC00; outline-offset: -22px; padding: 48px 40px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; aspect-ratio: 1.414; }
  .cert img { height: 70px; }
  .cert h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(26px, 5vw, 46px); }
  .cert .name { font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(28px, 6vw, 54px); border-bottom: 2px solid #0B1F3A; padding: 0 24px 6px; min-width: 60%; min-height: 1.3em; }
  .cert p { font-size: clamp(13px, 2.2vw, 19px); line-height: 1.45; max-width: 680px; }
  .cert .eu { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: auto; }
  .cert .eu svg { width: 60px; height: 40px; }
  .cert small { font-size: 11px; color: #4A5568; }
  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    body { background: #fff; padding: 0; }
    .form { display: none; }
    .cert { max-width: none; width: 100%; height: 185mm; aspect-ratio: auto; }
  }
</style>
</head>
<body>
<div class="form">
  <div class="langs" id="langs"></div>
  <input id="name" autocomplete="name">
  <button class="go" id="save"></button>
</div>
<div class="cert">
  <img src="img/kaszebi-logo.png" alt="Kaszëbi we swiecë">
  <h1 id="title"></h1>
  <div class="name" id="out"></div>
  <p id="body"></p>
  <div class="eu" id="eu"></div>
  <small>Fundacja Kaszëbi we swiecë · Associació Educativa i Cultural Blue Beehive (Ibi) · KA122-ADU 2026</small>
</div>
<script src="data.js?v=10"></script>
<script src="common.js?v=10"></script>
<script>
  if (!params.get('lang') && store('kws-lang')) LANG = store('kws-lang');
  const name = document.getElementById('name');
  function draw() {
    const el = document.getElementById('langs'); el.innerHTML = '';
    ['pl', 'en', 'es'].forEach((l) => el.append(h('button', { onclick: () => { LANG = l; draw(); }, style: l === LANG ? 'background:#0B1F3A;color:#fff' : '' }, l.toUpperCase())));
    name.placeholder = L(UI.certName);
    document.getElementById('save').textContent = '⬇ ' + L(UI.certSave);
    document.getElementById('title').textContent = L(UI.certTitle);
    document.getElementById('body').textContent = L(UI.certBody);
    document.getElementById('eu').innerHTML = EU_FLAG + '<span>' + L(UI.cofund) + '</span>';
    document.documentElement.lang = LANG === 'mx' ? 'es' : LANG;
  }
  name.addEventListener('input', () => { document.getElementById('out').textContent = name.value; });
  document.getElementById('save').onclick = () => { if (!name.value.trim()) { name.focus(); return; } print(); };
  draw();
</script>
</body>
</html>
