<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Certyfikat – Kaszëbi w Europie!</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #F5F3EC; color: #0B1F3A; font-family: 'Public Sans', Arial, sans-serif; padding: 14px; }
  .app { max-width: 540px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .top img { height: 40px; }
  .langs button { border: 1px solid #D9D5C8; background: #fff; border-radius: 8px; padding: 7px 9px; font: 700 14px 'Public Sans'; margin-left: 4px; color: #0B1F3A; }
  .langs button.on { background: #0B1F3A; color: #fff; }
  .steps { display: flex; gap: 6px; margin-bottom: 14px; }
  .steps i { flex: 1; height: 8px; border-radius: 4px; background: #D9D5C8; }
  .steps i.on { background: #1877F2; }
  .card { background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 6px 22px rgba(11,31,58,.1); display: flex; flex-direction: column; gap: 14px; }
  h1 { font: 600 26px/1.2 'Source Serif 4', Georgia, serif; }
  .hint { font-size: 15px; color: #4A5568; line-height: 1.4; }
  input.name { font: 700 22px 'Public Sans'; padding: 14px; border-radius: 14px; border: 3px solid #0B1F3A; width: 100%; }
  textarea { font: 17px/1.4 'Public Sans'; padding: 12px; border-radius: 14px; border: 2px solid #D9D5C8; min-height: 110px; width: 100%; }
  .padwrap { position: relative; border: 3px dashed #0B1F3A; border-radius: 16px; height: 170px; touch-action: none; background: #FCFCFA; }
  .padwrap canvas { width: 100%; height: 100%; display: block; }
  .padwrap span { position: absolute; left: 12px; bottom: 8px; color: #9AA3B2; font-size: 14px; pointer-events: none; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 60px; border-radius: 18px; border: 0; font: 900 20px 'Public Sans'; background: #0B1F3A; color: #fff; box-shadow: 0 5px 0 #08172B; text-decoration: none; }
  .btn.fb { background: #1877F2; box-shadow: 0 5px 0 #0E5BC2; font-size: 22px; min-height: 70px; }
  .btn.ghost { background: #fff; color: #0B1F3A; border: 2px solid #D9D5C8; box-shadow: none; font-weight: 700; font-size: 17px; min-height: 52px; }
  .btn:disabled { opacity: .5; }
  .link { background: none; border: 0; color: #4A5568; font: 700 15px 'Public Sans'; text-decoration: underline; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { aspect-ratio: 1; border-radius: 14px; border: 2px dashed #9AA3B2; background: #fff center/cover; display: grid; place-items: center; font-size: 34px; color: #9AA3B2; position: relative; overflow: hidden; }
  .slot input { position: absolute; inset: 0; opacity: 0; }
  .slot.has { border: 3px solid #1877F2; font-size: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font: 14px 'Public Sans'; padding: 8px 12px; border-radius: 99px; background: #fff; border: 1px solid #D9D5C8; color: #0B1F3A; }
  #preview { width: 100%; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .ok { background: #DDF1E4; border-radius: 14px; padding: 14px; font-weight: 700; line-height: 1.4; }
  @media print { body { background: #fff; padding: 0; } .app { display: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top"><img src="img/kaszebi-logo.png" alt="Kaszëbi we swiecë"><div class="langs" id="langs"></div></div>
  <div class="steps" id="steps"></div>
  <div id="main"></div>
</div>
<div class="certs" id="cert"></div>

<script src="data.js?v=68"></script>
<script src="common.js?v=68"></script>
<script src="cert-print.js?v=68"></script>
<script>
  if (!params.get('lang') && store('kws-lang')) LANG = store('kws-lang');
  const topic = params.get('t');
  const C = {
    s1: T('Twój certyfikat', 'Your certificate', 'Tu certificado'),
    s1h: T('Wpisz imię i nazwisko, a poniżej podpisz się palcem.', 'Type your full name and sign below with your finger.', 'Escribe tu nombre y firma abajo con el dedo.'),
    sign: T('✍️ Podpisz się palcem', '✍️ Sign with your finger', '✍️ Firma con el dedo'),
    clear: T('wyczyść', 'clear', 'borrar'),
    next: T('Dalej', 'Next', 'Siguiente'),
    s2: T('Dodaj zdjęcia z wyjazdu', 'Add photos from the trip', 'Añade fotos del viaje'),
    s2h: T('Do 3 zdjęć. Możesz pominąć.', 'Up to 3 photos. You can skip this.', 'Hasta 3 fotos. Puedes saltarlo.'),
    s3: T('Gotowe! Pochwal się', 'Done! Show it off', '¡Listo! Compártelo'),
    s3h: T('Możesz zmienić tekst albo zostawić nasz.', 'Change the text or keep ours.', 'Cambia el texto o deja el nuestro.'),
    defaultText: T('Wróciłam/em z Hiszpanii z nową wiedzą: jak rozpoznać oszustwa w sieci i nie dać się nabrać na fake newsy! 🇵🇱🇪🇸', 'Back from Spain with new skills: how to spot online scams and not fall for fake news! 🇵🇱🇪🇸', '¡Vuelvo de España sabiendo detectar estafas en internet y no caer en bulos! 🇵🇱🇪🇸'),
    starters: [T('Najbardziej zaskoczyło mnie… ', 'What surprised me most… ', 'Lo que más me sorprendió… '), T('Polecam taki wyjazd, bo… ', 'I recommend a trip like this because… ', 'Recomiendo un viaje así porque… ')],
    fb: T('Opublikuj na Facebooku', 'Post on Facebook', 'Publicar en Facebook'),
    pdf: T('Zapisz certyfikat (PDF)', 'Save the certificate (PDF)', 'Guardar el certificado (PDF)'),
    thanks: T('Dziękujemy! Pamiętaj, aby oznaczyć fundację: @Kaszëbi we swiecë. Tekst jest już skopiowany: wystarczy go wkleić.', 'Thank you! Remember to tag the foundation: @Kaszëbi we swiecë. The text is copied: just paste it.', '¡Gracias! Etiqueta a la fundación: @Kaszëbi we swiecë. El texto está copiado: solo pégalo.'),
    event: T('📅 Zobacz wydarzenie na Facebooku', '📅 See the event on Facebook', '📅 Ver el evento en Facebook'),
    sign2: T('Mobilność Erasmus+ „KASZËBI W EUROPIE!” · Ibi i Alicante 2026 · @Kaszëbi we swiecë · Współfinansowane przez Unię Europejską #ErasmusPlus #KaszëbiWEuropie #Cyberbezpieczeństwo', 'Erasmus+ mobility “KASZËBI IN EUROPE!” · Ibi and Alicante 2026 · @Kaszëbi we swiecë · Co-funded by the European Union #ErasmusPlus #KaszëbiWEuropie', 'Movilidad Erasmus+ «KASZËBI EN EUROPA» · Ibi y Alicante 2026 · @Kaszëbi we swiecë · Cofinanciado por la Unión Europea #ErasmusPlus #KaszëbiWEuropie')
  };
  const st = store('kws-cert') || { step: 0, name: '', sig: '', text: '' };
  const photos = [null, null, null];
  const saveSt = () => store('kws-cert', st);
  const main = document.getElementById('main');

  function langs() {
    const el = document.getElementById('langs'); el.innerHTML = '';
    ['pl', 'en', 'es'].forEach((l) => el.append(h('button', { class: l === LANG ? 'on' : '', onclick: () => { LANG = l; store('kws-lang', l); draw(); } }, l.toUpperCase())));
    document.getElementById('steps').innerHTML = [0, 1, 2].map((i) => `<i class="${i <= st.step ? 'on' : ''}"></i>`).join('');
  }

  function pad(container) {
    const cv = h('canvas'), wrap = h('div', { class: 'padwrap' }, cv, h('span', {}, L(C.sign)));
    container.append(wrap);
    const ctx = cv.getContext('2d');
    requestAnimationFrame(() => {
      const r = cv.getBoundingClientRect(), k = devicePixelRatio || 1;
      cv.width = r.width * k; cv.height = r.height * k; ctx.scale(k, k);
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B1F3A';
      if (st.sig) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = st.sig; }
    });
    let on = false;
    const pt = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', (e) => { on = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); });
    cv.addEventListener('pointermove', (e) => { if (!on) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); });
    cv.addEventListener('pointerup', () => { on = false; st.sig = cv.toDataURL('image/png'); saveSt(); });
    return () => { ctx.clearRect(0, 0, cv.width, cv.height); st.sig = ''; saveSt(); };
  }

  function draw() {
    langs(); main.innerHTML = '';
    const card = h('div', { class: 'card' }); main.append(card);
    if (st.step === 0) {
      const inp = h('input', { class: 'name', value: st.name, placeholder: L(UI.certName), autocomplete: 'name' });
      inp.oninput = () => { st.name = inp.value; saveSt(); };
      card.append(h('h1', {}, '🎓 ' + L(C.s1)), h('p', { class: 'hint' }, L(C.s1h)), inp);
      const clear = pad(card);
      card.append(h('button', { class: 'link', onclick: () => { clear(); } }, L(C.clear)),
        h('button', { class: 'btn', onclick: () => { if (!st.name.trim()) { inp.focus(); return; } st.step = 1; saveSt(); draw(); } }, L(C.next) + ' →'));
    } else if (st.step === 1) {
      card.append(h('h1', {}, '📷 ' + L(C.s2)), h('p', { class: 'hint' }, L(C.s2h)));
      const ph = h('div', { class: 'photos' });
      photos.forEach((p, i) => {
        const inp = h('input', { type: 'file', accept: 'image/*' });
        inp.onchange = () => { const f = inp.files[0]; if (!f) return; const im = new Image(); im.onload = () => { photos[i] = im; draw(); }; im.src = URL.createObjectURL(f); };
        ph.append(h('label', { class: 'slot' + (p ? ' has' : ''), style: p ? `background-image:url('${p.src}')` : '' }, '＋', inp));
      });
      card.append(ph, h('button', { class: 'btn', onclick: () => { st.step = 2; saveSt(); draw(); } }, L(C.next) + ' →'),
        h('button', { class: 'link', onclick: () => { st.step = 0; saveSt(); draw(); } }, '← ' + L(C.s1)));
    } else {
      if (!st.text) st.text = L(C.defaultText);
      const ta = h('textarea', {}); ta.value = st.text; ta.oninput = () => { st.text = ta.value; saveSt(); };
      const prev = h('img', { id: 'preview', alt: '' });
      makeImage().then((b) => { prev.src = URL.createObjectURL(b); });
      const fbBtn = h('button', { class: 'btn fb', onclick: () => share(fbBtn) }, 'f  ' + L(C.fb));
      card.append(h('h1', {}, '🎉 ' + L(C.s3)), prev, h('p', { class: 'hint' }, L(C.s3h)), ta,
        h('div', { class: 'chips' }, C.starters.map((s) => h('button', { class: 'chip', onclick: () => { ta.value += '\n' + L(s); st.text = ta.value; saveSt(); ta.focus(); } }, '+ ' + L(s).trim()))),
        fbBtn, h('div', { id: 'done' }),
        h('button', { class: 'btn ghost', onclick: printCert }, '⬇ ' + L(C.pdf)),
        window.FB.event ? h('a', { class: 'btn ghost', href: window.FB.event, target: '_blank' }, L(C.event)) : null,
        h('button', { class: 'link', onclick: () => { st.step = 1; saveSt(); draw(); } }, '← ' + L(C.s2)));
    }
  }

  const load = (src) => new Promise((r) => { if (!src) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
  function cover(x, img, a, b, w, hh, rad) {
    x.save(); x.beginPath(); x.roundRect(a, b, w, hh, rad); x.clip();
    const s = Math.max(w / img.width, hh / img.height);
    x.drawImage(img, a + (w - img.width * s) / 2, b + (hh - img.height * s) / 2, img.width * s, img.height * s); x.restore();
  }
  function wrap(x, text, cx, y, maxW, lh) {
    let line = '';
    for (const w of text.split(' ')) { const t = line + w + ' '; if (x.measureText(t).width > maxW && line) { x.fillText(line.trim(), cx, y); line = w + ' '; y += lh; } else line = t; }
    x.fillText(line.trim(), cx, y); return y;
  }
  // 1080×1350 picture for Facebook: certificate with signature on top, photos below.
  async function makeImage() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
    const x = c.getContext('2d');
    x.fillStyle = '#F5F3EC'; x.fillRect(0, 0, 1080, 1350);
    x.fillStyle = '#fff'; x.strokeStyle = '#0B1F3A'; x.lineWidth = 12; x.beginPath(); x.roundRect(40, 40, 1000, 760, 24); x.fill(); x.stroke();
    x.strokeStyle = '#FFCC00'; x.lineWidth = 4; x.beginPath(); x.roundRect(62, 62, 956, 716, 16); x.stroke();
    const boss = bossData();
    const [logo, eu, bb, sig, bsig, stamp] = await Promise.all([load('img/kaszebi-logo.png'), load('img/eu-pl.jpg'), load('img/bluebeehive.jpg'), load(st.sig), load(boss.sig), load(boss.stamp)]);
    if (logo) x.drawImage(logo, 540 - 110, 84, 220, 220 * logo.height / logo.width);
    x.textAlign = 'center'; x.fillStyle = '#0B1F3A';
    x.font = '600 48px "Source Serif 4", Georgia, serif'; x.fillText(L(UI.certTitle), 540, 250);
    x.font = '600 60px "Source Serif 4", Georgia, serif'; x.fillText(st.name.trim() || '…', 540, 340);
    x.fillRect(240, 360, 600, 3);
    x.font = '400 21px "Public Sans", Arial'; x.fillStyle = '#26334A';
    let y = wrap(x, L(UI.certBody), 540, 402, 880, 29) + 40;
    // Two short competence columns: digital skills and cybersecurity.
    const cols = [
      [T('💻 Kompetencje cyfrowe', '💻 Digital skills', '💻 Competencias digitales'), T('tablet, aplikacje, kody QR', 'tablet, apps, QR codes', 'tableta, apps, códigos QR'), T('AI: Copilot / ChatGPT', 'AI: Copilot / ChatGPT', 'IA: Copilot / ChatGPT'), T('Google Lens, fact-checking', 'Google Lens, fact-checking', 'Google Lens, verificación')],
      [T('🛡️ Cyberbezpieczeństwo', '🛡️ Cybersecurity', '🛡️ Ciberseguridad'), T('phishing, SMS, deepfake', 'phishing, texts, deepfakes', 'phishing, SMS, deepfakes'), T('silne hasła, 2FA, BLIK', 'strong passwords, 2FA', 'contraseñas seguras, 2FA'), T('bezpieczny telefon i dane', 'safe phone and data', 'móvil y datos seguros')]
    ];
    cols.forEach((col, i) => col.forEach((t, j) => {
      x.font = j ? '400 20px "Public Sans", Arial' : '700 23px "Public Sans", Arial'; x.fillStyle = j ? '#26334A' : '#003399';
      x.fillText((j ? '✓ ' : '') + L(t), 300 + i * 480, y + j * 28);
    }));
    // Participant signature in the middle; with the president's signature on this device, the two sit side by side.
    const two = !!(bsig || stamp), px = two ? 430 : 540, bx = 680;
    const put = (img, cx, hh, maxW) => { const w = Math.min(maxW, hh * img.width / img.height); x.drawImage(img, cx - w / 2, 738 - hh, w, hh); };
    if (sig) put(sig, px, 70, two ? 190 : 300);
    if (stamp) { x.globalAlpha = .85; put(stamp, bx, 96, 120); x.globalAlpha = 1; }
    if (bsig) put(bsig, bx, 64, 190);
    x.fillStyle = '#8A94A6'; x.font = `400 ${two ? 14 : 16}px "Public Sans", Arial`;
    if (two) { x.fillRect(340, 740, 180, 2); x.fillText(L(UI.certSignP), px, 762); x.fillRect(590, 740, 180, 2); x.fillText(L(UI.certSignBoss), bx, 762); }
    else { x.fillRect(400, 740, 280, 2); x.fillText(L(UI.certSignP), 540, 762); }
    if (eu) x.drawImage(eu, 90, 700, 200, 200 * eu.height / eu.width);
    if (bb) x.drawImage(bb, 830, 708, 150, 150 * bb.height / bb.width);
    const list = photos.filter(Boolean);
    if (list.length) { const gap = 20, w = (1000 - gap * (list.length - 1)) / list.length; list.forEach((p, i) => cover(x, p, 40 + i * (w + gap), 830, w, 480, 22)); }
    else { x.fillStyle = '#003399'; x.beginPath(); x.roundRect(40, 830, 1000, 480, 22); x.fill(); x.fillStyle = '#FFCC00'; x.font = '900 70px "Public Sans", Arial'; x.fillText('Ibi · Alicante 2026', 540, 1090); }
    return new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9));
  }

  async function share(btn) {
    btn.disabled = true;
    const blob = await makeImage();
    const text = [st.text.trim(), L(C.sign2), window.FB.event].filter(Boolean).join('\n\n');
    try { await navigator.clipboard.writeText(text); } catch (e) { /* clipboard blocked */ }
    const file = new File([blob], 'kaszebi-w-europie.jpg', { type: 'image/jpeg' });
    let shared = false;
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); shared = true; }
      else { const a = h('a', { href: URL.createObjectURL(blob), download: 'kaszebi-w-europie.jpg' }); document.body.append(a); a.click(); a.remove(); window.open(window.FB.page, '_blank'); shared = true; }
    } catch (e) { /* closed the share sheet */ }
    if (shared) {
      // Organiser summary: count shares (no personal data, just the device).
      if (topic && !store('kws-fb-sent-' + topic)) { Live.sendSure(topic, { k: 'fb', d: deviceId() }, null, 6).then((ok) => { if (ok) store('kws-fb-sent-' + topic, 1); }); }
      document.getElementById('done').innerHTML = ''; document.getElementById('done').append(h('p', { class: 'ok' }, '✓ ' + L(C.thanks)));
    }
    btn.disabled = false;
  }

  function printCert() {
    // President's signature/stamp come from this device's storage (added on prezes.html); without them the line stays empty.
    document.getElementById('cert').innerHTML = certHtml(st.name, st.sig, bossData());
    setTimeout(print, 300);
  }
  draw();
</script>
</body>
</html>
