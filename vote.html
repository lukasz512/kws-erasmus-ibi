<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaszëbi w Europie! – telefon</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  :root { --cream:#F5F3EC; --navy:#0B1F3A; --eu:#003399; --ok:#1E7B4A; --bad:#B3261E; --line:#D9D5C8; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--cream); color: var(--navy); font-family: 'Public Sans', Arial, sans-serif; min-height: 100vh; padding: 16px 16px 40px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  header img { height: 44px; }
  .langs button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 15px; }
  .langs button.on { background: var(--navy); color: #fff; }
  h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; line-height: 1.2; margin-bottom: 16px; }
  .btn { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; margin-bottom: 12px; padding: 12px 16px; border-radius: 16px; border: 3px solid var(--line); background: #fff; font: inherit; font-size: 20px; font-weight: 700; color: var(--navy); text-align: left; }
  .btn b { width: 42px; height: 42px; border-radius: 10px; background: var(--eu); color: #fff; display: grid; place-items: center; flex: none; }
  .btn.pick { border-color: var(--eu); background: #E6EBF2; }
  .btn.main { background: var(--navy); color: #fff; border-color: var(--navy); justify-content: center; }
  .btn:disabled { opacity: .4; }
  .grp i { width: 42px; height: 42px; border-radius: 50%; flex: none; }
  .msg { font-size: 20px; padding: 16px; border-radius: 14px; background: #fff; margin-top: 8px; line-height: 1.4; }
  .msg.ok { background: #DDF1E4; }
  .img { height: 170px; border-radius: 14px; background-size: cover; background-position: center; margin-bottom: 12px; }
  #map { height: 52vh; border-radius: 16px; margin-bottom: 12px; overflow: hidden; }
  input.code { width: 100%; font: 700 34px 'Public Sans', Arial; letter-spacing: .15em; text-transform: uppercase; text-align: center; padding: 14px; border-radius: 14px; border: 3px solid var(--navy); margin: 8px 0 14px; }
  .help { font-size: 17px; color: #4A5568; line-height: 1.4; }
  .prog { height: 10px; background: #fff; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
  .prog i { display: block; height: 100%; background: var(--eu); }
  .nav { display: flex; gap: 10px; }
  .nav .btn { justify-content: center; }
  .me { font-size: 15px; color: #4A5568; margin-top: 22px; display: flex; gap: 8px; align-items: center; }
  .me button { border: 0; background: none; text-decoration: underline; color: #4A5568; font: inherit; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; background: var(--c); transform: rotate(-45deg); border: 4px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.35); }
</style>
</head>
<body>
<header><img src="img/kaszebi-logo.png" alt="Kaszëbi we swiecë"><div class="langs" id="langs"></div></header>
<main id="main"></main>
<script src="data.js?v=17"></script>
<script src="vendor/maplibre-gl.js"></script>
<script src="common.js?v=17"></script>
<script src="maps.js?v=17"></script>
<script>
const topic = params.get('t');
const dev = deviceId();
const gKey = 'kws-group-' + topic;
let group = store(gKey);
let open = null;               // {key, mode, phase}
const mine = store('kws-mine-' + topic) || {};
const revealed = {};
const main = document.getElementById('main');
let phoneMap = null, picked = null;
if (!params.get('lang') && store('kws-lang')) LANG = store('kws-lang');

function langs() {
  const el = document.getElementById('langs'); el.innerHTML = '';
  ['pl', 'en', 'es'].forEach((l) => el.append(h('button', { class: l === LANG ? 'on' : '', onclick: () => { LANG = l; store('kws-lang', l); draw(); } }, l.toUpperCase())));
}
function remember() { store('kws-mine-' + topic, mine); }
function footerMe() {
  const g = GROUPS[group];
  main.append(h('p', { class: 'me' }, h('span', { class: 'dot', style: `background:${g.color}` }), L(g.name), ' · ',
    h('button', { onclick: () => { group = null; store(gKey, null); draw(); } }, L(UI.change))));
}

function draw() {
  langs();
  if (phoneMap) { phoneMap.destroy(); phoneMap = null; }
  main.innerHTML = '';
  if (!topic) { main.append(h('p', { class: 'msg' }, L(UI.scan))); return; }
  if (group == null) {
    main.append(h('h1', {}, L(UI.pickGroup)));
    GROUPS.forEach((g, i) => main.append(h('button', { class: 'btn grp', onclick: () => { group = i; store(gKey, i); Live.send(topic, { k: 'j', g: i, d: dev }); draw(); } }, h('i', { style: `background:${g.color}` }), L(g.name))));
    return;
  }
  if (!open) main.append(h('h1', {}, '👀 ' + L(UI.wait)));
  else if (open.mode === 'q') drawPoll();
  else if (open.mode === 'guess' || open.mode === 'pin') drawMap();
  else if (open.mode === 'survey') drawSurvey();
  footerMe();
}

function drawPoll() {
  const q = qOf(open.key);
  if (!q) return;
  main.append(h('h1', {}, L(q.q)));
  q.a.forEach((a, i) => main.append(h('button', { class: 'btn' + (mine[open.key] === i ? ' pick' : ''), onclick: () => {
    mine[open.key] = i; remember(); Live.send(topic, { k: 'v', key: open.key, a: i, g: group, d: dev }); draw();
  } }, h('b', {}, 'ABCD'[i]), L(a))));
  if (mine[open.key] != null) main.append(h('p', { class: 'msg' }, '✓ ' + L(UI.thanks) + ' ' + L(UI.wait)));
}

function drawMap() {
  const isGuess = open.mode === 'guess', G = isGuess ? window.GUESS[open.key] : null;
  main.append(h('h1', {}, L(isGuess ? MAP_UI.guessQ : MAP_UI.pinQ)));
  if (G) main.append(h('div', { class: 'img', style: `background-image:url('${G.img}')` }));
  main.append(h('p', { class: 'help' }, L(isGuess ? MAP_UI.guessHelp : MAP_UI.pinHelp)));
  const box = h('div', { id: 'map' });
  main.append(box);
  const sent = mine[open.key];
  const btn = h('button', { class: 'btn main', disabled: true, onclick: () => {
    if (!picked) return;
    mine[open.key] = picked; remember();
    Live.send(topic, { k: isGuess ? 'gs' : 'pin', key: open.key, at: picked, g: group, d: dev });
    draw();
  } }, '📍 ' + L(MAP_UI.confirm));
  main.append(btn);
  if (sent) {
    const extra = isGuess && revealed[open.key] ? ` ${km(sent, G.at).toFixed(1)} ${L(MAP_UI.km)}` : '';
    main.append(h('p', { class: 'msg ok' }, '✓ ' + L(UI.thanks) + extra));
  }
  picked = sent || null;
  if (picked) btn.disabled = false;
  if (!window.maplibregl) return;
  phoneMap = pinsMap(box, isGuess ? window.REGION_VIEW : { center: [-0.45, 38.42], zoom: 7.6 }, true);
  const color = GROUPS[group].color;
  phoneMap.map.on('load', () => {
    if (picked) phoneMap.set('me', picked, color);
    if (isGuess && revealed[open.key]) phoneMap.reveal(G.at, picked ? [picked] : []);
  });
  phoneMap.map.on('click', (e) => {
    if (isGuess && revealed[open.key]) return;
    picked = [Math.round(e.lngLat.lng * 1e5) / 1e5, Math.round(e.lngLat.lat * 1e5) / 1e5];
    phoneMap.set('me', picked, color);
    btn.disabled = false;
  });
}

// Survey: code → 10 questions, one per screen → send once.
function drawSurvey() {
  const ph = open.phase, dk = 'kws-survey-draft-' + ph;
  const d = store(dk) || { code: '', step: -1, ans: [] };
  const saveD = () => store(dk, d);
  main.append(h('p', { class: 'help' }, L(SURVEY_UI.title) + ' · ' + L(SURVEY_UI[ph])));
  if (d.sent) { main.append(h('p', { class: 'msg ok' }, '✓ ' + L(SURVEY_UI.done))); return; }
  if (d.step < 0) {
    const inp = h('input', { class: 'code', maxlength: '4', value: d.code, placeholder: 'A07', autocomplete: 'off' });
    main.append(h('h1', {}, L(SURVEY_UI.code)), h('p', { class: 'help' }, L(SURVEY_UI.codeHelp)), inp,
      h('button', { class: 'btn main', onclick: () => {
        const c = inp.value.trim().toUpperCase();
        if (!/^[A-ZĄĆĘŁŃÓŚŹŻÑ]\d{1,2}$/.test(c)) { inp.focus(); inp.style.borderColor = '#B3261E'; return; }
        d.code = c; d.step = 0; saveD(); draw();
      } }, L(SURVEY_UI.start)));
    return;
  }
  const n = window.SURVEY.length;
  if (d.step >= n) {
    main.append(h('h1', {}, '✓'),
      h('button', { class: 'btn main', onclick: () => {
        Live.send(topic, { k: 's', phase: ph, code: d.code, g: group, ans: d.ans, d: dev });
        d.sent = true; saveD(); draw();
      } }, L(SURVEY_UI.send)),
      h('button', { class: 'btn', onclick: () => { d.step = n - 1; saveD(); draw(); } }, '←'));
    return;
  }
  const q = window.SURVEY[d.step];
  main.append(h('div', { class: 'prog' }, h('i', { style: `width:${(100 * d.step) / n}%` })),
    h('p', { class: 'help' }, `${d.step + 1} / ${n} · ${d.code}`), h('h1', {}, L(q.q)));
  q.a.forEach((a, i) => main.append(h('button', { class: 'btn' + (d.ans[d.step] === i ? ' pick' : ''), onclick: () => {
    d.ans[d.step] = i; d.step++; saveD(); draw(); scrollTo(0, 0);
  } }, h('b', {}, 'ABC'[i]), L(a))));
  if (d.step > 0) main.append(h('div', { class: 'nav' }, h('button', { class: 'btn', onclick: () => { d.step--; saveD(); draw(); } }, '←')));
}

function handle(m) {
  const x = Live.parse(m); if (!x) return;
  if (x.k === 'o' && x.key) {
    if (open && open.key === x.key) return;
    open = { key: x.key, mode: x.mode || 'q', phase: x.phase };
    draw(); if (navigator.vibrate) navigator.vibrate(80);
  }
  if (x.k === 'r' && x.key) { revealed[x.key] = true; if (open && x.key === open.key) draw(); }
}

draw();
if (topic) {
  Live.history(topic).then((ms) => {
    const xs = ms.map(Live.parse).filter(Boolean);
    xs.forEach((x) => { if (x.k === 'r') revealed[x.key] = true; });
    const last = xs.filter((x) => x.k === 'o').pop();
    if (last) open = { key: last.key, mode: last.mode || 'q', phase: last.phase };
    draw();
  });
  Live.listen(topic, handle);
}
</script>
</body>
</html>
