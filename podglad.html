<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Podgląd widoków – Kaszëbi w Europie!</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Public Sans', Arial, sans-serif; color: #0B1F3A; background: #E9ECF2; padding: 24px 16px 60px; }
  header { max-width: 1400px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  header img { height: 44px; }
  h1 { font: 600 28px 'Source Serif 4', Georgia, serif; }
  .note { max-width: 1400px; margin: 0 auto 18px; color: #4A5568; font-size: 15px; line-height: 1.5; }
  .langs { margin-left: auto; display: flex; gap: 6px; }
  .langs button { font: 700 15px 'Public Sans'; padding: 8px 14px; border-radius: 10px; border: 2px solid #0B1F3A; background: #fff; color: #0B1F3A; cursor: pointer; }
  .langs button.on { background: #0B1F3A; color: #fff; }
  section { max-width: 1400px; margin: 0 auto 28px; }
  h2 { font: 700 13px 'Public Sans'; letter-spacing: .14em; text-transform: uppercase; color: #003399; margin: 0 0 12px; display: flex; gap: 10px; align-items: center; }
  h2::after { content: ''; flex: 1; height: 1px; background: #CBD2DE; }
  .row { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 8px; }
  figure { flex: none; display: grid; gap: 8px; }
  figcaption { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
  figcaption a { color: #003399; font-weight: 400; }
  /* Phone 390×800 shown at 75%; tablet 820×1000 at 50%. */
  .ph { width: 293px; height: 600px; border-radius: 28px; border: 8px solid #0B1F3A; overflow: hidden; background: #fff; }
  .tab { width: 418px; height: 508px; border-radius: 22px; border: 8px solid #0B1F3A; overflow: hidden; background: #fff; }
  .ph iframe { width: 390px; height: 800px; border: 0; transform: scale(.7333); transform-origin: top left; }
  .tab iframe { width: 820px; height: 1000px; border: 0; transform: scale(.4902); transform-origin: top left; }
</style>
</head>
<body>
<header><img src="img/kaszebi-logo.png" alt="Kaszëbi we swiecë"><h1>Podgląd: wszystkie widoki uczestnika</h1>
  <div class="langs" id="langs"></div></header>
<p class="note">Tryb podglądu: przyciski działają, ale nic nie jest wysyłane do prezentacji ani arkusza, a certyfikat pokazuje przykładową osobę. „otwórz” pokazuje widok na pełnym ekranie.</p>
<div id="all"></div>
<script src="data.js?v=74"></script>
<script>
  // One preview session id so nothing mixes with a real class session.
  const TOPIC = 'podglad';
  let lang = new URLSearchParams(location.search).get('lang') || 'pl';
  const name = (t) => (t && t[lang]) || (t && t.pl) || '';
  function build() {
    document.getElementById('langs').innerHTML = ['pl', 'en', 'es'].map((l) => `<button class="${l === lang ? 'on' : ''}" data-l="${l}">${l.toUpperCase()}</button>`).join('');
    const q = (extra) => `pv=1&t=${TOPIC}&lang=${lang}${extra ? '&' + extra : ''}`;
    const groups = [
      ['Wejście z kodu QR', [['Wybór języka', `lang.html?${q()}`], ['Prezentacja na telefonie', `index.html?${q('view=1&d=p1&s=0')}`]]],
      ...Object.keys(window.DAYS).map((d) => [name(window.DAYS[d].name), [
        ['Lista zadań', `vote.html?${q('day=' + d)}`],
        ...window.DAYS[d].acts.map((a, i) => [`Zadanie ${i + 1}`, `vote.html?${q(`day=${d}&open=${i}`)}`])
      ]]),
      ['Certyfikat', [['1. Imię i podpis', `cert.html?${q().replace('pv=1', 'pv=0')}`], ['2. Zdjęcia', `cert.html?${q()}`], ['3. Certyfikat do pobrania i na FB', `cert.html?${q().replace('pv=1', 'pv=2')}`]]]
    ];
    document.getElementById('all').innerHTML = groups.map(([g, items]) => `<section><h2>${g}</h2><div class="row">${items.map(([t, u, k]) =>
      `<figure><figcaption>${t}<a href="${u}" target="_blank">otwórz ↗</a></figcaption><div class="${k || 'ph'}"><iframe loading="lazy" src="${u}" title="${t}"></iframe></div></figure>`).join('')}</div></section>`).join('');
  }
  document.getElementById('langs').onclick = (e) => { const l = e.target.dataset.l; if (!l) return; lang = l; history.replaceState(null, '', '?lang=' + l); build(); };
  build();
</script>
</body>
</html>
